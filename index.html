<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>hk3rd story text searcher</title>
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem('dialogue-theme'); } catch {}
      document.documentElement.dataset.theme = ['light', 'dark'].includes(saved)
        ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg:#f7f9fa; --card:#fff; --text:#1f2328; --muted:#656d76;
      --border:#d8dee4; --soft:#f6f8fa; --hover:#f0f4f8;
      --input:#fff; --accent:#0969da; --accent-hover:#0757b5;
      --mark:#fff1a8; --mark-text:#24292f; --error:#b42318;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
      line-height:1.6; color:var(--text); background:var(--bg);
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#b1bac4;
      --border:#30363d; --soft:#1c2128; --hover:#21262d;
      --input:#0d1117; --accent:#1f6feb; --accent-hover:#195fce;
      --mark:#634b08; --mark-text:#fff3b0; --error:#ff9993;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; padding:40px 20px; }
    button,input { font:inherit; }
    button { min-height:44px; padding:9px 18px; border:1px solid var(--border); border-radius:7px; background:var(--soft); color:var(--text); cursor:pointer; }
    button:hover:not(:disabled) { background:var(--hover); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button:focus-visible,input:focus-visible { outline:3px solid #58a6ff; outline-offset:3px; }
    .container { max-width:1200px; margin:auto; overflow:hidden; border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:0 8px 30px rgb(0 0 0 / 6%); }
    .header { padding:30px; }
    .heading { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
    h1 { margin:0; font-size:clamp(22px,4vw,29px); letter-spacing:-.04em; }
    .badge { padding:3px 10px; border:1px solid var(--border); border-radius:20px; background:var(--soft); color:var(--muted); font-size:13px; }
    .theme-toggle { margin-left:auto; font-size:13px; white-space:nowrap; }
    .theme-toggle[aria-pressed="true"] { border-color:#58a6ff; }
    .description { margin:9px 0 22px; color:var(--muted); font-size:14px; }
    .search-form { display:flex; gap:10px; }
    .search-input { flex:1; width:100%; min-width:0; min-height:46px; padding:10px 14px; border:1px solid var(--border); border-radius:7px; background:var(--input); color:var(--text); font-size:16px; }
    .search-input::placeholder { color:var(--muted); }
    .search-button { min-width:88px; background:var(--accent); border-color:var(--accent); color:white; font-weight:600; }
    .search-button:hover:not(:disabled) { background:var(--accent-hover); }
    .status-bar { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 16px; padding:13px 30px; border-block:1px solid var(--border); background:var(--soft); font-size:14px; }
    .range,.page-info { color:var(--muted); font-variant-numeric:tabular-nums; }
    .loading,.error { padding:45px 24px; text-align:center; }
    .loading { color:var(--muted); }
    .error { color:var(--error); }
    .spinner { width:32px; height:32px; margin:auto; border:3px solid var(--border); border-top-color:#58a6ff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; text-align:left; font-size:14px; }
    .chapter-column { width:18%; }
    .speaker-column { width:17%; }
    th,td { padding:16px 20px; border-bottom:1px solid var(--border); vertical-align:top; overflow-wrap:anywhere; }
    th { background:var(--soft); color:var(--muted); font-size:13px; font-weight:600; }
    td { white-space:pre-wrap; }
    tbody tr:hover { background:var(--hover); }
    tbody tr:last-child td { border-bottom:0; }
    .highlight { border-radius:2px; background:var(--mark); color:var(--mark-text); }
    .empty { padding:60px 20px; color:var(--muted); text-align:center; }
    .pagination { display:flex; align-items:center; justify-content:center; gap:18px; padding:20px; border-top:1px solid var(--border); }
    .page-info { font-size:14px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:600px) {
      body { padding:16px 10px; }
      .header { padding:22px 16px; }
      .status-bar { padding:12px 16px; }
      .search-form { flex-direction:column; }
      .theme-toggle { margin-left:0; }
      .chapter-column { width:23%; }
      .speaker-column { width:22%; }
      th,td { padding:12px 9px; }  
      table { font-size:13px; }
      .pagination { gap:12px; padding:16px 10px; }
      .pagination button { padding:8px 13px; }
    }
    @media(prefers-reduced-motion:reduce) { .spinner { animation:none; } }
    .dialogue-link { display:block; width:100%; min-height:44px; padding:0; border:0; background:transparent; color:var(--text); text-align:left; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; cursor:pointer; }
    .dialogue-link:hover:not(:disabled) { background:transparent; text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:4px; }
    .context-dialog { width:min(1100px,calc(100% - 24px)); max-height:90dvh; padding:0; border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); }
    .context-dialog::backdrop { background:rgb(0 0 0 / 65%); }
    .context-layout { display:flex; flex-direction:column; max-height:85dvh; }
    .context-header { padding:18px 20px; border-bottom:1px solid var(--border); }
    .context-heading { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
    .context-heading h2 { margin:0; font-size:20px; }
    .context-note { margin:8px 0 0; color:var(--muted); font-size:13px; }
    .context-scroll { overflow:auto; min-height:0; overscroll-behavior:contain; }
    .context-selected,.context-selected:hover { background:var(--soft); }
    .context-selected td:first-child { box-shadow:inset 4px 0 #58a6ff; }
    .selected-label { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; font-weight:600; }
    .context-controls { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; padding:14px; border-top:1px solid var(--border); }
    .context-range { width:100%; text-align:center; color:var(--muted); font-size:13px; }
    html { -webkit-text-size-adjust:100%; }
    body.context-open { overflow:hidden; }
    button { touch-action:manipulation; }
    .context-header,.context-controls { flex-shrink:0; }
    @media(max-width:680px) {
      body { padding:12px max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); }
      .header { padding:20px 16px; }
      .heading { gap:10px; }
      h1 { flex-basis:100%; font-size:23px; line-height:1.4; overflow-wrap:anywhere; }
      .theme-toggle { margin-left:auto; }
      .description { line-height:1.7; margin:14px 0 18px; }
      .search-form { flex-direction:column; }
      .search-input { min-height:50px; }
      .search-button { min-height:48px; }
      .status-bar { padding:12px 16px; }
      .table-wrap { overflow:visible; }
      table,tbody { display:block; width:100%; }
      colgroup { display:none; }
      thead { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); clip-path:inset(50%); }
      tbody { padding:12px; background:var(--bg); }
      tbody tr { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; margin-bottom:12px; padding:16px; background:var(--card); border:1px solid var(--border); border-radius:10px; }
      tbody tr:last-child { margin-bottom:0; }
      tbody tr:hover { background:var(--card); }
      td { display:block; min-width:0; padding:0; border:0; font-size:14px; line-height:1.7; }
      td::before { display:block; margin-bottom:4px; color:var(--muted); font-size:12px; font-weight:600; }
      td:nth-child(1)::before { content:'장명'; }
      td:nth-child(2)::before { content:'화자'; }
      td:nth-child(3) { grid-column:1 / -1; padding-top:12px; border-top:1px solid var(--border); font-size:16px; line-height:1.85; }
      td:nth-child(3)::before { content:'대사'; }
      td.empty { grid-column:1 / -1; padding:30px 0; text-align:center; }
      td.empty::before { content:none; }
      .dialogue-link { font-size:16px; line-height:1.85; }
      .dialogue-link::after { content:'주변 대사 보기 ›'; display:block; margin-top:10px; color:var(--muted); font-size:12px; }
      .pagination { gap:12px; padding:16px 12px; }
      .pagination button { min-height:48px; flex:1; max-width:120px; }
      .context-dialog { width:100%; max-width:100%; height:100%; height:100dvh; max-height:100%; max-height:100dvh; margin:0; border:0; border-radius:0; }
      .context-layout { height:100%; max-height:100%; }
      .context-header { padding:max(12px,env(safe-area-inset-top)) 16px 12px; }
      .context-heading { gap:8px; }
      .context-heading h2 { font-size:18px; }
      #closeContext { font-size:13px; padding:8px 12px; }
      .context-note { font-size:12px; line-height:1.6; }
      .context-scroll { flex:1; }
      .context-controls { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); background:var(--card); }
      .context-range { grid-column:1 / -1; font-size:12px; }
      .context-controls button { min-width:0; min-height:48px; padding:8px 4px; font-size:12px; }
      .context-selected,.context-selected:hover { border-color:#58a6ff; background:var(--soft); box-shadow:inset 3px 0 #58a6ff; }
      .context-selected td:first-child { box-shadow:none; }
    }
    @media(max-width:680px) {
      #contextBody { padding:8px 10px; }
      #contextBody tr { display:block; margin-bottom:6px; padding:10px 12px; border-radius:7px; font-size:15px; line-height:1.7; overflow-wrap:anywhere; }
      #contextBody td:first-child { display:none; }
      #contextBody td:nth-child(2),
      #contextBody td:nth-child(3) { display:inline; padding:0; border:0; font-size:inherit; line-height:inherit; }
      #contextBody td:nth-child(2) { font-weight:600; }
      #contextBody td::before { content:none; }
      #contextBody td:nth-child(2)::after { content:' : '; white-space:pre; font-weight:400; }
    }
    #toggleContextChapter { display:none; }
    @media(max-width:680px) {
      #toggleContextChapter { display:inline-flex; align-items:center; min-height:44px; margin-top:8px; padding:6px 10px; font-size:12px; }
      #toggleContextChapter[aria-pressed="true"] { border-color:#58a6ff; }
      #contextDialog.show-chapter #contextBody td:first-child { display:block; margin:0 0 4px; padding:0; border:0; box-shadow:none; color:var(--muted); font-size:12px; line-height:1.5; }
      #contextDialog.show-chapter #contextBody .selected-label { display:none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="heading">
        <h1>붕3 메인스토리 텍스트 검색</h1>
        <span id="totalCount" class="badge">데이터 불러오는 중</span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false"><span id="themeIcon" aria-hidden="true">☾</span> 다크 모드</button>
      </div>
      <p class="description">장명, 화자, 대사에서 검색합니다. 검색된 대사를 눌러 앞뒤 대사를 볼 수 있습니다.</p>
      <form id="searchForm" class="search-form" role="search">
        <label for="searchInput" class="sr-only">대사 검색</label>
        <input id="searchInput" class="search-input" type="search" placeholder="장명, 등장인물 또는 대사를 입력하세요 (예: 31장, 라이덴 메이)" autocomplete="off" disabled>
        <button id="searchButton" class="search-button" type="submit" disabled>검색</button>
      </form>
    </header>
    <section aria-label="검색 결과">
      <div class="status-bar">
        <span id="status" role="status" aria-live="polite">데이터를 불러오는 중입니다.</span>
        <span id="resultRange" class="range"></span>
      </div>
      <div id="loading" class="loading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loadingText">대사 데이터를 불러오고 있습니다…</p>
      </div>          
      <div id="errorBox" class="error" role="alert" hidden>
        <strong>데이터를 불러오지 못했습니다.</strong>
        <p id="errorMessage"></p>
        <button id="retryButton" type="button">다시 시도</button>
      </div>
      <div id="results" aria-busy="true" hidden>
        <div class="table-wrap">
          <table>
            <caption class="sr-only">장명, 화자, 대사 검색 결과</caption>
            <colgroup><col class="chapter-column"><col class="speaker-column"><col></colgroup>
            <thead><tr><th scope="col">장명</th><th scope="col">화자</th><th scope="col">대사</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="검색 결과 페이지">
          <button id="prevButton" type="button" disabled>이전</button>
          <span id="pageInfo" class="page-info" aria-live="polite">0 / 0 페이지</span>
          <button id="nextButton" type="button" disabled>다음</button>
        </nav>
      </div>
    </section>
    <noscript><p class="error">검색기를 사용하려면 JavaScript를 활성화해 주세요.</p></noscript>
  </main>
  <dialog id="contextDialog" class="context-dialog" aria-labelledby="contextTitle" aria-describedby="contextNote">
    <div class="context-layout">
      <header class="context-header">
        <div class="context-heading">
          <h2 id="contextTitle">주변 대사</h2>
          <button id="closeContext" type="button" autofocus>검색 결과로 돌아가기</button>
        </div>
        <p id="contextNote" class="context-note">선택한 대사의 앞뒤 20개 대사를 표시합니다.</p>
        <button id="toggleContextChapter" type="button" aria-label="장명 표시" aria-pressed="false" aria-controls="contextBody">장명 표시 OFF</button>
      </header>
      <div id="contextScroll" class="context-scroll" tabindex="0" aria-label="주변 대사 목록">
        <table>
          <caption class="sr-only">선택한 대사 주변의 원문</caption>
          <colgroup><col class="chapter-column"><col class="speaker-column"><col></colgroup>
          <thead><tr><th scope="col">장명</th><th scope="col">화자</th><th scope="col">대사</th></tr></thead>
          <tbody id="contextBody"></tbody>
        </table>
      </div>
      <nav class="context-controls" aria-label="주변 대사 이동">
        <span id="contextRange" class="context-range" role="status"></span>
        <button id="contextPrevious" type="button">이전 41줄</button>
        <button id="contextOriginal" type="button">선택한 대사로</button>
        <button id="contextNext" type="button">다음 41줄</button>
      </nav>
    </div>
  </dialog>
  <script>
    'use strict';
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('themeToggle');
      const icon = document.getElementById('themeIcon');
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      let userTheme = null;
      try {
        const saved = localStorage.getItem('dialogue-theme');
        if (saved === 'light' || saved === 'dark') userTheme = saved;
      } catch {}
      function applyTheme(theme) {
        const dark = theme === 'dark';
        root.dataset.theme = theme;
        button.setAttribute('aria-pressed', String(dark));
        button.title = dark ? '라이트 모드로 전환' : '다크 모드로 전환';
        icon.textContent = dark ? '☀' : '☾';
      }
      applyTheme(userTheme || (systemTheme.matches ? 'dark' : 'light'));
      button.addEventListener('click', () => {
        userTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(userTheme);
        try { localStorage.setItem('dialogue-theme', userTheme); } catch {}
      });
      systemTheme.addEventListener('change', event => {
        if (userTheme === null) applyTheme(event.matches ? 'dark' : 'light');
      });
    })();

    const PAGE_SIZE = 50;
    const CHUNK_SIZE = 2000;
    const formatter = new Intl.NumberFormat('ko-KR');
    const formatNumber = value => formatter.format(value);
    const pause = () => new Promise(resolve => setTimeout(resolve, 0));
    const $ = id => document.getElementById(id);
    const ui = {
      total:$('totalCount'), form:$('searchForm'), input:$('searchInput'),
      searchButton:$('searchButton'), status:$('status'), range:$('resultRange'),
      loading:$('loading'), loadingText:$('loadingText'), error:$('errorBox'),
      errorMessage:$('errorMessage'), retry:$('retryButton'), results:$('results'),
      body:$('tableBody'), previous:$('prevButton'), next:$('nextButton'), page:$('pageInfo')
    };
    let records = [], searchIndex = [], matches = null;
    let currentPage = 1, activeQuery = '', highlightPattern = null;
    let ready = false, searching = false, searchVersion = 0;
    const asText = value => value == null ? '' : String(value);
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      })[character]);
    }
    function escapeRegExp(value) { return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function highlight(value) {
      if (value.trim() === '') return '-';
      if (!highlightPattern) return escapeHTML(value);
      highlightPattern.lastIndex = 0;
      let html = '', offset = 0, match;
      // 일치 구간과 나머지 원문을 각각 escape하여 HTML 삽입을 방지합니다.
      while ((match = highlightPattern.exec(value)) !== null) {
        html += escapeHTML(value.slice(offset, match.index));
        html += '<span class="highlight">' + escapeHTML(match[0]) + '</span>';
        offset = match.index + match[0].length;
      }
      return html + escapeHTML(value.slice(offset));
    }
    const resultCount = () => matches === null ? records.length : matches.length;
    function updatePagination() {
      const pages = Math.ceil(resultCount() / PAGE_SIZE);
      ui.page.textContent = pages === 0 ? '0 / 0 페이지'
        : `${formatNumber(currentPage)} / ${formatNumber(pages)} 페이지`;
      ui.previous.disabled = searching || pages === 0 || currentPage <= 1;
      ui.next.disabled = searching || pages === 0 || currentPage >= pages;
    }
    function renderPage() {
      if (!activeQuery) {
        ui.results.hidden = true;
        ui.body.innerHTML = '';
        ui.range.textContent = '';
        ui.status.textContent = '검색어를 입력해 주세요.';
        return;
      }
      ui.results.hidden = false;
      const count = resultCount();
      const pages = Math.ceil(count / PAGE_SIZE);
      currentPage = Math.max(1, Math.min(currentPage, pages || 1));
      
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, count);
      if (!count) {
        ui.body.innerHTML = '<tr><td colspan="3" class="empty">검색 결과가 없습니다.</td></tr>';
        ui.range.textContent = '0건 표시';
      } else {
        const rows = [];
        for (let index = start; index < end; index++) {
          const recordIndex = matches === null ? index : matches[index];
          const record = records[recordIndex];
          rows.push('<tr><td>' + highlight(record.chapter) + '</td><td>' +
            highlight(record.speaker) + '</td><td><button type="button" class="dialogue-link" data-record-index="' + recordIndex + '" aria-haspopup="dialog" title="앞뒤 대사 보기">' + highlight(record.text) + '</button></td></tr>');
        }
        ui.body.innerHTML = rows.join('');
        ui.range.textContent = `${formatNumber(start + 1)}–${formatNumber(end)} / ${formatNumber(count)}건`;
      }
      ui.status.textContent = activeQuery ? `검색 결과: ${formatNumber(count)}건`
        : `준비 완료 · 전체 ${formatNumber(count)}건`;
      updatePagination();
    }
    async function search() {
      if (!ready) return;
      const version = ++searchVersion;
      const query = ui.input.value.trim(), loweredQuery = query.toLowerCase();
      searching = true;
      ui.results.setAttribute('aria-busy', 'true');
      ui.status.textContent = '검색 중입니다…';
      updatePagination();
      let found = null;
      if (loweredQuery !== '') {
        found = [];
        await pause();
        for (let start = 0; start < searchIndex.length; start += CHUNK_SIZE) {
          if (version !== searchVersion) return;
          const end = Math.min(start + CHUNK_SIZE, searchIndex.length);
          for (let index = start; index < end; index++) {
            const fields = searchIndex[index];
            if (fields[0].includes(loweredQuery) || fields[1].includes(loweredQuery) || fields[2].includes(loweredQuery)) found.push(index);
          }
          await pause();
        }
      }
      if (version !== searchVersion) return;
      matches = found;
      activeQuery = query;
      highlightPattern = query ? new RegExp(escapeRegExp(query), 'gi') : null;
      currentPage = 1;
      searching = false;
      renderPage();
      ui.results.setAttribute('aria-busy', 'false');
    }
    async function loadData() {
      ready = false; searching = false; searchVersion++;
      records = []; searchIndex = []; matches = null;
      activeQuery = ''; highlightPattern = null; currentPage = 1;
      ui.input.disabled = true; ui.searchButton.disabled = true;
      ui.error.hidden = true; ui.results.hidden = true;
      ui.results.setAttribute('aria-busy', 'true');
      ui.loading.hidden = false;
      ui.loadingText.textContent = '대사 데이터를 불러오고 있습니다…';
      ui.total.textContent = '데이터 불러오는 중';
      ui.status.textContent = '데이터를 불러오는 중입니다.';
      ui.range.textContent = '';
      try {
        if (location.protocol === 'file:') throw new Error('GitHub Pages 또는 로컬 웹 서버에서 열어주세요. 파일을 직접 열면 dialogue.json을 불러올 수 없습니다.');
        const response = await fetch('./dialogue.json');
        if (!response.ok) throw new Error(`dialogue.json 요청 실패 (HTTP ${response.status}). index.html과 같은 폴더에 파일이 있는지 확인해 주세요.`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('dialogue.json의 최상위 데이터는 배열이어야 합니다.');
        ui.loadingText.textContent = '검색 데이터를 준비하고 있습니다…';
        await pause();
        for (let start = 0; start < data.length; start += CHUNK_SIZE) {
          const end = Math.min(start + CHUNK_SIZE, data.length);
          for (let index = start; index < end; index++) {
            const item = data[index];
            if (!item || typeof item !== 'object' || Array.isArray(item)) throw new Error(`${formatNumber(index + 1)}번째 항목이 올바른 객체가 아닙니다.`);
            const record = { chapter:asText(item.chapter), speaker:asText(item.speaker), text:asText(item.text) };
            records.push(record);
            searchIndex.push([record.chapter.toLowerCase(), record.speaker.toLowerCase(), record.text.toLowerCase()]);
          }
          ui.loadingText.textContent = `검색 데이터 준비 중… ${formatNumber(end)} / ${formatNumber(data.length)}건`;
          await pause();
        }
        ready = true;
        ui.total.textContent = `전체 ${formatNumber(records.length)}건`;
        ui.input.disabled = false; ui.searchButton.disabled = false; ui.results.hidden = false;
        renderPage();
      } catch (error) {
        records = []; searchIndex = [];
        ui.total.textContent = '불러오기 실패';
        ui.status.textContent = '데이터를 불러오지 못했습니다.';
        ui.errorMessage.textContent = error instanceof SyntaxError
          ? 'dialogue.json의 JSON 형식이 올바른지 확인해 주세요.'
          : (error.message || '파일 경로와 네트워크 연결을 확인해 주세요.');
          
        ui.error.hidden = false;
      } finally {
        ui.loading.hidden = true;
        ui.results.setAttribute('aria-busy', 'false');
      }
    }
    const contextDialog = $('contextDialog');
    const toggleContextChapter = $('toggleContextChapter');
    toggleContextChapter.addEventListener('click', () => {
      const show = toggleContextChapter.getAttribute('aria-pressed') !== 'true';
      contextDialog.classList.toggle('show-chapter', show);
      toggleContextChapter.setAttribute('aria-pressed', String(show));
      toggleContextChapter.textContent = show ? '장명 표시 ON' : '장명 표시 OFF';
    });
    const CONTEXT_SIZE = 41;
    let selectedRecordIndex = -1, contextStart = 0;
    function renderContext(centerSelected = false) {
      const end = Math.min(contextStart + CONTEXT_SIZE, records.length);
      const rows = [];
      for (let index = contextStart; index < end; index++) {
        const record = records[index];
        const selected = index === selectedRecordIndex;
        rows.push('<tr' + (selected ? ' id="selectedContextRow" class="context-selected"' : '') + '><td>' +
          (selected ? '<span class="selected-label">선택한 대사</span>' : '') +
          highlight(record.chapter) + '</td><td>' + highlight(record.speaker) + '</td><td>' + highlight(record.text) + '</td></tr>');
      }
      $('contextBody').innerHTML = rows.join('');
      $('contextRange').textContent = `${formatNumber(contextStart + 1)}–${formatNumber(end)} / 전체 ${formatNumber(records.length)}줄`;
      $('contextPrevious').disabled = contextStart === 0;
      $('contextNext').disabled = end >= records.length;
      const scroller = $('contextScroll');
      scroller.scrollTop = 0;
      if (centerSelected) {
        const row = $('selectedContextRow');
        if (row) {
          const rowRect = row.getBoundingClientRect();
          const scrollRect = scroller.getBoundingClientRect();
          scroller.scrollTop = rowRect.top - scrollRect.top - Math.max(0, (scroller.clientHeight - rowRect.height) / 2);
        }
      }
    }
    function openContext(index) {
      if (searching || !Number.isInteger(index) || index < 0 || index >= records.length) return;
      selectedRecordIndex = index;
      contextStart = Math.max(0, index - 20);
      contextDialog.showModal();
      document.body.classList.add('context-open');
      renderContext(true);
    }
    ui.body.addEventListener('click', event => {
      const button = event.target.closest('button[data-record-index]');
      if (button && ui.body.contains(button)) openContext(Number(button.dataset.recordIndex));
    });
    $('closeContext').addEventListener('click', () => contextDialog.close());
    contextDialog.addEventListener('close', () => document.body.classList.remove('context-open'));
    $('contextPrevious').addEventListener('click', () => {
      contextStart = Math.max(0, contextStart - CONTEXT_SIZE);
      renderContext();
    });
    $('contextNext').addEventListener('click', () => {
      if (contextStart + CONTEXT_SIZE >= records.length) return;
      contextStart += CONTEXT_SIZE;
      renderContext();
    });
    $('contextOriginal').addEventListener('click', () => {
      contextStart = Math.max(0, selectedRecordIndex - 20);
      renderContext(true);
    });
    ui.form.addEventListener('submit', event => { event.preventDefault(); void search(); });
    ui.previous.addEventListener('click', () => {
      if (searching || currentPage <= 1) return;
      currentPage--; renderPage();
      ui.results.scrollIntoView({block:'start'});
    });
    ui.next.addEventListener('click', () => {
      if (searching || currentPage >= Math.ceil(resultCount() / PAGE_SIZE)) return;
      currentPage++; renderPage();
      ui.results.scrollIntoView({block:'start'});
    });
    ui.retry.addEventListener('click', () => { void loadData(); });
    void loadData();
  </script>
</body>
</html>
