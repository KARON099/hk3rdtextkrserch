<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>텍스트를 입력하고 엔터</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #1f2328;
      background: #f7f9fa;
      font-synthesis: none;
      line-height: 1.6;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      padding: 40px 20px;
    }

    button, input { font: inherit; }

    button {
      min-height: 44px;
      padding: 9px 18px;
      border: 1px solid #d0d7de;
      border-radius: 7px;
      background: #fff;
      color: #24292f;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #f3f4f6; }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #0969da;
      outline-offset: 3px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 30px rgb(31 35 40 / 5%);
    }

    .header { padding: 30px; }

    .heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 29px);
      letter-spacing: -.04em;
    }

    .badge {
      padding: 3px 10px;
      border: 1px solid #d8dee4;
      border-radius: 20px;
      background: #f6f8fa;
      color: #57606a;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .description {
      margin: 9px 0 22px;
      color: #656d76;
      font-size: 14px;
    }

    .search-form {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 10px 14px;
      border: 1px solid #d0d7de;
      border-radius: 7px;
      background: #fff;
      color: #1f2328;
      font-size: 16px;
    }

    .search-button {
      min-width: 88px;
      border-color: #0969da;
      background: #0969da;
      color: white;
      font-weight: 600;
    }

    .search-button:hover:not(:disabled) { background: #0757b5; }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 16px;
      padding: 13px 30px;
      border-top: 1px solid #d8dee4;
      border-bottom: 1px solid #d8dee4;
      background: #f6f8fa;
      font-size: 14px;
    }

    .range { color: #656d76; }

    .loading, .error {
      padding: 45px 24px;
      text-align: center;
    }

    .loading p, .error p { margin: 12px 0; }

    .loading { color: #656d76; }

    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto;
      border: 3px solid #dbe7f3;
      border-top-color: #0969da;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #b42318; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: left;
      font-size: 14px;
    }

    .chapter-column { width: 18%; }
    .speaker-column { width: 17%; }

    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid #eaeef2;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      background: #fafbfc;
      color: #57606a;
      font-size: 13px;
      font-weight: 600;
    }

    td { white-space: pre-wrap; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr:last-child td { border-bottom: 0; }

    .highlight {
      border-radius: 2px;
      background: #fff1a8;
      color: #24292f;
      box-shadow: 0 0 0 1px rgb(212 167 44 / 15%);
    }

    .empty {
      padding: 60px 20px;
      color: #656d76;
      text-align: center;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      border-top: 1px solid #d8dee4;
    }

    .page-info {
      color: #57606a;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      body { padding: 16px 10px; }
      .header { padding: 22px 16px; }
      .status-bar { padding: 12px 16px; }
      .search-form { flex-direction: column; }
      .chapter-column { width: 23%; }
      .speaker-column { width: 22%; }
      th, td { padding: 12px 9px; }
      table { font-size: 13px; }
      .pagination { gap: 12px; padding: 16px 10px; }
      .pagination button { padding: 8px 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="heading">
        <h1>스토리 대사 검색기</h1>
        <span id="totalCount" class="badge">데이터 불러오는 중</span>
      </div>

      <p class="description">
        장명, 화자, 대사에서 검색합니다. 결과는 한 페이지에 50건씩 표시됩니다.
      </p>

      <form id="searchForm" class="search-form" role="search">
        <label for="searchInput" class="sr-only">대사 검색</label>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="장명, 등장인물 또는 대사를 입력하세요"
          autocomplete="off"
          disabled
        >
        <button id="searchButton" class="search-button" type="submit" disabled>
          검색
        </button>
      </form>
    </header>

    <section aria-label="검색 결과">
      <div class="status-bar">
        <span id="status" role="status" aria-live="polite">
          데이터를 불러오는 중입니다.
        </span>
        <span id="resultRange" class="range"></span>
      </div>

      <div id="loading" class="loading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loadingText">대사 데이터를 불러오고 있습니다…</p>
      </div>

      <div id="errorBox" class="error" role="alert" hidden>
        <strong>데이터를 불러오지 못했습니다.</strong>
        <p id="errorMessage"></p>
        <button id="retryButton" type="button">다시 시도</button>
      </div>

      <div id="results" aria-busy="true" hidden>
        <div class="table-wrap">
          <table>
            <caption class="sr-only">장명, 화자, 대사 검색 결과</caption>
            <colgroup>
              <col class="chapter-column">
              <col class="speaker-column">
              <col>
            </colgroup>
            <thead>
              <tr>
                <th scope="col">장명</th>
                <th scope="col">화자</th>
                <th scope="col">대사</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <nav class="pagination" aria-label="검색 결과 페이지">
          <button id="prevButton" type="button" disabled>이전</button>
          <span id="pageInfo" class="page-info" aria-live="polite">
            0 / 0 페이지
          </span>
          <button id="nextButton" type="button" disabled>다음</button>
        </nav>
      </div>
    </section>

    <noscript>
      <p class="error">검색기를 사용하려면 JavaScript를 활성화해 주세요.</p>
    </noscript>
  </main>

  <script>
    "use strict";

    const PAGE_SIZE = 50;
    const CHUNK_SIZE = 2000;
    const numberFormat = new Intl.NumberFormat("ko-KR");
    const formatNumber = value => numberFormat.format(value);
    const pause = () => new Promise(resolve => setTimeout(resolve, 0));

    const $ = id => document.getElementById(id);
    const ui = {
      total: $("totalCount"),
      form: $("searchForm"),
      input: $("searchInput"),
      searchButton: $("searchButton"),
      status: $("status"),
      range: $("resultRange"),
      loading: $("loading"),
      loadingText: $("loadingText"),
      error: $("errorBox"),
      errorMessage: $("errorMessage"),
      retry: $("retryButton"),
      results: $("results"),
      body: $("tableBody"),
      previous: $("prevButton"),
      next: $("nextButton"),
      page: $("pageInfo")
    };

    let records = [];
    let searchIndex = [];

    // null이면 전체 데이터, 배열이면 일치하는 데이터의 인덱스 목록입니다.
    let matches = null;
    let currentPage = 1;
    let activeQuery = "";
    let highlightPattern = null;
    let ready = false;
    let searching = false;
    let searchVersion = 0;

    function asText(value) {
      return value == null ? "" : String(value);
    }

    function displayText(value) {
      return value.trim() === "" ? "-" : value;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(value) {
      const text = displayText(value);

      if (!highlightPattern || value.trim() === "") {
        return escapeHTML(text);
      }

      // 원문에서 일치 구간을 찾고 각 구간을 별도로 HTML escape합니다.
      // 데이터나 검색어가 HTML 태그로 실행되지 않습니다.
      highlightPattern.lastIndex = 0;

      let html = "";
      let offset = 0;
      let match;

      while ((match = highlightPattern.exec(text)) !== null) {
        html += escapeHTML(text.slice(offset, match.index));
        html += '<span class="highlight">' +
          escapeHTML(match[0]) + "</span>";
        offset = match.index + match[0].length;
      }

      return html + escapeHTML(text.slice(offset));
    }

    function resultCount() {
      return matches === null ? records.length : matches.length;
    }

    function updatePagination() {
      const pages = Math.ceil(resultCount() / PAGE_SIZE);

      ui.page.textContent = pages === 0
        ? "0 / 0 페이지"
        : `${formatNumber(currentPage)} / ${formatNumber(pages)} 페이지`;

      ui.previous.disabled = searching || pages === 0 || currentPage <= 1;
      ui.next.disabled = searching || pages === 0 || currentPage >= pages;
    }

    function renderPage() {
      const count = resultCount();
      const pages = Math.ceil(count / PAGE_SIZE);

      currentPage = Math.max(1, Math.min(currentPage, pages || 1));

      const start = (currentPage - 1) * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, count);

      if (count === 0) {
        ui.body.innerHTML =
          '<tr><td colspan="3" class="empty">검색 결과가 없습니다.</td></tr>';
        ui.range.textContent = "0건 표시";
      } else {
        const rows = [];

        // DOM에는 항상 최대 50개 행만 생성합니다.
        for (let index = start; index < end; index++) {
          const recordIndex = matches === null ? index : matches[index];
          const record = records[recordIndex];

          rows.push(
            "<tr>" +
              "<td>" + highlight(record.chapter) + "</td>" +
              "<td>" + highlight(record.speaker) + "</td>" +
              "<td>" + highlight(record.text) + "</td>" +
            "</tr>"
          );
        }

        ui.body.innerHTML = rows.join("");
        ui.range.textContent =
          `${formatNumber(start + 1)}–${formatNumber(end)} / ` +
          `${formatNumber(count)}건`;
      }

      ui.status.textContent = activeQuery
        ? `검색 결과: ${formatNumber(count)}건`
        : `준비 완료 · 전체 ${formatNumber(count)}건`;

      updatePagination();
    }

    async function search() {
      if (!ready) return;

      // 새 검색이 시작되면 이전 검색 결과가 화면을 덮어쓰지 못하게 합니다.
      const version = ++searchVersion;
      const query = ui.input.value.trim();
      const loweredQuery = query.toLowerCase();

      searching = true;
      ui.results.setAttribute("aria-busy", "true");
      ui.status.textContent = "검색 중입니다…";
      updatePagination();

      let found = null;

      if (loweredQuery !== "") {
        found = [];

        // 검색 작업을 나누어 실행해 브라우저가 중간에 화면을 갱신하도록 합니다.
        await pause();

        for (let start = 0; start < searchIndex.length; start += CHUNK_SIZE) {
          if (version !== searchVersion) return;

          const end = Math.min(start + CHUNK_SIZE, searchIndex.length);

          for (let index = start; index < end; index++) {
            const fields = searchIndex[index];

            if (
              fields[0].includes(loweredQuery) ||
              fields[1].includes(loweredQuery) ||
              fields[2].includes(loweredQuery)
            ) {
              found.push(index);
            }
          }

          await pause();
        }
      }

      if (version !== searchVersion) return;

      matches = found;
      activeQuery = query;
      highlightPattern = query
        ? new RegExp(escapeRegExp(query), "gi")
        : null;
      currentPage = 1;
      searching = false;

      renderPage();
      ui.results.setAttribute("aria-busy", "false");
    }

    async function loadData() {
      ready = false;
      searching = false;
      searchVersion++;
      records = [];
      searchIndex = [];
      matches = null;
      activeQuery = "";
      highlightPattern = null;
      currentPage = 1;

      ui.input.disabled = true;
      ui.searchButton.disabled = true;
      ui.error.hidden = true;
      ui.results.hidden = true;
      ui.results.setAttribute("aria-busy", "true");
      ui.loading.hidden = false;
      ui.loadingText.textContent = "대사 데이터를 불러오고 있습니다…";
      ui.total.textContent = "데이터 불러오는 중";
      ui.status.textContent = "데이터를 불러오는 중입니다.";
      ui.range.textContent = "";

      try {
        if (location.protocol === "file:") {
          throw new Error(
            "GitHub Pages 또는 로컬 웹 서버에서 열어주세요. " +
            "파일을 직접 열면 dialogue.json을 불러올 수 없습니다."
          );
        }

        const response = await fetch("./dialogue.json");

        if (!response.ok) {
          throw new Error(
            `dialogue.json 요청 실패 (HTTP ${response.status}). ` +
            "index.html과 같은 폴더에 파일이 있는지 확인해 주세요."
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("dialogue.json의 최상위 데이터는 배열이어야 합니다.");
        }

        ui.loadingText.textContent = "검색 데이터를 준비하고 있습니다…";
        await pause();

        for (let start = 0; start < data.length; start += CHUNK_SIZE) {
          const end = Math.min(start + CHUNK_SIZE, data.length);

          for (let index = start; index < end; index++) {
            const item = data[index];

            if (!item || typeof item !== "object" || Array.isArray(item)) {
              throw new Error(
                `${formatNumber(index + 1)}번째 항목이 올바른 객체가 아닙니다.`
              );
            }

            const record = {
              chapter: asText(item.chapter),
              speaker: asText(item.speaker),
              text: asText(item.text)
            };

            records.push(record);

            // 소문자 변환은 초기 로딩 때 한 번만 수행합니다.
            searchIndex.push([
              record.chapter.toLowerCase(),
              record.speaker.toLowerCase(),
              record.text.toLowerCase()
            ]);
          }

          ui.loadingText.textContent =
            `검색 데이터 준비 중… ${formatNumber(end)} / ` +
            `${formatNumber(data.length)}건`;

          await pause();
        }

        ready = true;
        ui.total.textContent = `전체 ${formatNumber(records.length)}건`;
        ui.input.disabled = false;
        ui.searchButton.disabled = false;
        ui.results.hidden = false;

        renderPage();
      } catch (error) {
        records = [];
        searchIndex = [];
        ui.total.textContent = "불러오기 실패";
        ui.status.textContent = "데이터를 불러오지 못했습니다.";
        ui.errorMessage.textContent = error instanceof SyntaxError
          ? "dialogue.json의 JSON 형식이 올바른지 확인해 주세요."
          : (error.message || "파일 경로와 네트워크 연결을 확인해 주세요.");
        ui.error.hidden = false;
      } finally {
        ui.loading.hidden = true;
        ui.results.setAttribute("aria-busy", "false");
      }
    }

    ui.form.addEventListener("submit", event => {
      event.preventDefault();
      void search();
    });

    ui.previous.addEventListener("click", () => {
      if (searching || currentPage <= 1) return;
      currentPage--;
      renderPage();
    });

    ui.next.addEventListener("click", () => {
      if (
        searching ||
        currentPage >= Math.ceil(resultCount() / PAGE_SIZE)
      ) return;

      currentPage++;
      renderPage();
    });

    ui.retry.addEventListener("click", () => {
      void loadData();
    });

    void loadData();
  </script>
</body>
</html>
